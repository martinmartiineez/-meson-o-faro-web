<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="O Faro Gestión">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>O Faro · Gestión</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260901-1">
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">MESÓN O FARO</div>
        <div id="topSubtitle" class="subtitle">Gestión</div>
      </div>
      <button id="homeButton" class="icon-button" type="button" aria-label="Ir al inicio" hidden>⌂</button>
    </header>

    <main id="app" class="app-main" aria-live="polite"></main>

    <nav id="bottomNav" class="bottom-nav" hidden aria-label="Navegación principal">
      <button data-route="home" class="nav-item is-active" type="button"><span>⌂</span><small>Inicio</small></button>
      <button data-route="reservations" class="nav-item" type="button"><span>▣</span><small>Reservas</small></button>
      <button data-route="web" class="nav-item" type="button"><span>◇</span><small>Web</small></button>
      <button data-route="participations" class="nav-item" type="button"><span>◎</span><small>Premios</small></button>
      <button data-route="tickets" class="nav-item" type="button"><span>▤</span><small>Tickets</small></button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel" role="dialog" aria-modal="true">
      <div class="modal-grabber"></div>
      <div id="modalContent"></div>
    </section>
  </div>

  <div id="printRoot" class="print-root" aria-hidden="true"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="app.js?v=20260901-1" defer></script>
</body>
</html>
