<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Carta · Mesón O Faro</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="stylesheet" href="styles.css?v=20260829-1900">
  <style>
    .menu-group[hidden]{display:none!important}
    .allergen-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
    .allergen-tag{display:inline-flex;align-items:center;border:1px solid #ddd6c8;border-radius:999px;padding:4px 8px;background:#faf8f3;color:#635c50;font-size:.68rem;font-weight:800}
    .menu-item-allergens{margin-top:7px}
    .menu-item-allergens strong{display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:#8a806f;margin-bottom:4px}
  </style>
</head>
<body style="background:#fff">
<div class="page-shell">
  <header class="page-top">
    <div class="page-top-inner">
      <a class="page-back" href="index.html">← Inicio</a>
      <div class="page-brand">Mesón O Faro</div>
      <a class="btn dark" href="index.html#contacto">Contacto</a>
    </div>
  </header>

  <main class="page-content">
    <div class="page-hero">
      <div class="kicker">Mesón O Faro</div>
      <h1>Nuestra carta.</h1>
      <p class="menu-note">Selecciona una categoría para consultar sus platos y precios.</p>
    </div>

    <div id="dataStatus" class="data-status" aria-live="polite" hidden>Cargando carta…</div>
    <div id="categoryChips" class="chips" role="tablist" aria-label="Categorías de la carta"></div>
    <div id="menuSections" class="menu-sections"></div>

    <div id="menuFooterNote" class="menu-footer-note"><strong>Información de la carta:</strong> IVA incluido · servicio en terraza: suplemento de 0,20 € por producto.</div>
  </main>
</div>

<nav class="bottom" aria-label="Navegación móvil">
  <a href="menu-dia.html">Menú del día</a>
  <a href="index.html">Inicio</a>
  <a class="main" href="carta.html" aria-current="page">Carta</a>
</nav>

<script src="data-config.js?v=20260901-contact1"></script>
<script src="site-data.js?v=20260901-perf1"></script>
<script src="fast-data.js?v=20260901-carta5"></script>
<script src="allergens-fallback.js?v=20260901-3"></script>
<script src="fast-perf.js?v=20260901-carta5"></script>
<script>
(function(){
  const status = document.getElementById('dataStatus');
  const chips = document.getElementById('categoryChips');
  const sections = document.getElementById('menuSections');
  const footer = document.getElementById('menuFooterNote');

  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const slug = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'categoria';
  const money = value => Number(value).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';

  function allergenHtml(raw){
    const tags = String(raw || '').split(/[,;|]/).map(x=>x.trim()).filter(Boolean);
    if(!tags.length) return '';
    return '<div class="menu-item-allergens"><strong>Alérgenos</strong><div class="allergen-tags">'+tags.map(tag=>'<span class="allergen-tag">'+esc(tag)+'</span>').join('')+'</div></div>';
  }

  function activateCategory(id, updateHash){
    const tabs = Array.from(chips.querySelectorAll('.chip'));
    const panels = Array.from(sections.querySelectorAll('.menu-group'));
    const target = panels.find(panel => panel.id === id) || panels[0];
    if(!target) return;

    panels.forEach(panel => {
      panel.hidden = panel !== target;
      panel.setAttribute('aria-hidden', panel === target ? 'false' : 'true');
    });

    tabs.forEach(tab => {
      const active = tab.dataset.target === target.id;
      tab.classList.toggle('active', active);
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
      tab.setAttribute('tabindex', active ? '0' : '-1');
    });

    const activeTab = tabs.find(tab => tab.dataset.target === target.id);
    if(activeTab && updateHash) activeTab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
    if(updateHash && history.replaceState) history.replaceState(null,'','#'+target.id);
  }

  function render(data){
    const items = (data && data.carta || []).filter(x => x && x.producto && x.categoria && x.disponible !== false);
    if(!items.length){
      status.hidden = false;
      status.textContent = 'No hay platos disponibles en este momento.';
      chips.innerHTML = '';
      sections.innerHTML = '';
      return;
    }

    const currentPanel = sections.querySelector('.menu-group:not([hidden])');
    const currentId = currentPanel ? currentPanel.id : decodeURIComponent(location.hash.replace('#',''));
    const groups = [];
    const map = new Map();

    items.forEach(item => {
      if(!map.has(item.categoria)){
        const group = {name:item.categoria,items:[]};
        map.set(item.categoria,group);
        groups.push(group);
      }
      map.get(item.categoria).items.push(item);
    });
    groups.forEach(g => g.items.sort((a,b)=>(Number(a.orden)||0)-(Number(b.orden)||0)));

    chips.innerHTML = groups.map((g,i)=>{
      const id = slug(g.name);
      return '<a class="chip '+(i===0?'active':'')+'" href="#'+id+'" role="tab" aria-controls="'+id+'" aria-selected="'+(i===0?'true':'false')+'" tabindex="'+(i===0?'0':'-1')+'" data-target="'+id+'">'+esc(g.name)+'</a>';
    }).join('');

    sections.innerHTML = groups.map((g,i) => {
      const id = slug(g.name);
      const hasHalf = g.items.some(x => x.precioMedia !== null && x.precioMedia !== '' && typeof x.precioMedia !== 'undefined');
      const header = hasHalf ? '½ ración · ración' : 'Precio';
      const rows = g.items.map(item => {
        const prices = [];
        if(item.precioMedia !== null && item.precioMedia !== '' && typeof item.precioMedia !== 'undefined') prices.push('<span>'+money(item.precioMedia)+'</span>');
        if(item.precioRacion !== null && item.precioRacion !== '' && typeof item.precioRacion !== 'undefined') prices.push('<span>'+money(item.precioRacion)+'</span>');
        return '<div class="menu-item"><div><h4>'+esc(item.producto)+'</h4>'+(item.descripcion?'<p>'+esc(item.descripcion)+'</p>':'')+allergenHtml(item.alergenos)+'</div><div class="menu-prices">'+prices.join('')+'</div></div>';
      }).join('');
      return '<article class="menu-group" id="'+id+'" role="tabpanel" aria-hidden="'+(i===0?'false':'true')+'" '+(i===0?'':'hidden')+'><div class="menu-group-head"><h3>'+esc(g.name)+'</h3><div class="menu-columns">'+header+'</div></div><div class="menu-list">'+rows+'</div></article>';
    }).join('');

    const firstId = slug(groups[0].name);
    let desired = currentId || firstId;
    if(!Array.from(sections.querySelectorAll('.menu-group')).some(panel=>panel.id===desired)) desired = firstId;
    activateCategory(desired,false);

    const inc = data.config && Number(data.config.incrementoTerraza);
    const terrace = Number.isFinite(inc) ? money(inc) : '0,20 €';
    footer.innerHTML = '<strong>Información de la carta:</strong> IVA incluido · servicio en terraza: suplemento de '+terrace+' por producto.';
    status.hidden = true;
  }

  chips.addEventListener('click', event => {
    const tab = event.target.closest('.chip');
    if(!tab) return;
    event.preventDefault();
    activateCategory(tab.dataset.target,true);
  });

  chips.addEventListener('keydown', event => {
    if(event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
    const tabs = Array.from(chips.querySelectorAll('.chip'));
    const current = tabs.indexOf(document.activeElement);
    if(current < 0) return;
    event.preventDefault();
    const next = event.key === 'ArrowRight' ? (current + 1) % tabs.length : (current - 1 + tabs.length) % tabs.length;
    tabs[next].focus();
    activateCategory(tabs[next].dataset.target,true);
  });

  window.addEventListener('ofaro:carta-updated',event=>{
    if(event && event.detail) render(event.detail);
  });

  OfaroFastData.loadCarta(true).then(render).catch(()=>{
    status.hidden = false;
    status.textContent = 'No se pudo cargar la carta.';
  });
})();
</script>
</body>
</html>
