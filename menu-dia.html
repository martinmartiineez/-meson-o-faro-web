<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Menú del día · Mesón O Faro</title>
  <link rel="preconnect" href="https://docs.google.com">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="stylesheet" href="styles.css?v=20260829-1900">
  <link rel="stylesheet" href="menu-prices.css?v=20260829-1900">
</head>
<body style="background:#fff">
<div class="page-shell">
  <header class="page-top">
    <div class="page-top-inner">
      <a class="page-back" href="index.html">← Inicio</a>
      <div class="page-brand">Mesón O Faro</div>
      <a class="btn dark" href="carta.html">Carta</a>
    </div>
  </header>

  <main class="page-content">
    <section class="page-hero">
      <div class="kicker">Hoy en O Faro</div>
      <h1>Menú del día.</h1>
      <p class="menu-note">Los platos se pueden cambiar desde el panel de gestión. El sistema admite dos, tres o los platos que queráis en cada apartado.</p>
    </section>

    <div id="menuDayStatus" class="data-status" aria-live="polite">Cargando menú…</div>
    <section id="dailyMenu" class="daily-menu" aria-live="polite"></section>

    <div class="menu-price-grid" aria-label="Precios del menú del día">
      <div class="menu-price-box">
        <span>Menú completo</span>
        <strong data-menu-price-full>13 €</strong>
      </div>
      <div class="menu-price-box half">
        <span>Medio menú</span>
        <strong data-menu-price-half>10 €</strong>
      </div>
    </div>
  </main>
</div>

<nav class="bottom" aria-label="Navegación móvil">
  <a class="main" href="menu-dia.html" aria-current="page">Menú del día</a>
  <a href="index.html">Inicio</a>
  <a href="carta.html">Carta</a>
</nav>

<script src="data-config.js?v=20260901-perf1"></script>
<script src="site-data.js?v=20260901-perf1"></script>
<script src="perf.js?v=20260901-perf1"></script>
<script src="fast-data.js?v=20260829-1900"></script>
<script src="fast-perf.js?v=20260901-perf1"></script>
<script>
(function(){
  const status = document.getElementById('menuDayStatus');
  const root = document.getElementById('dailyMenu');
  const fullPrice = document.querySelector('[data-menu-price-full]');
  const halfPrice = document.querySelector('[data-menu-price-half]');
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const formatPrice = value => Number(value).toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:2}) + ' €';

  function render(data){
    const items = (data.menu || []).filter(x => x && x.plato && x.tipo && x.disponible !== false);
    const groups = [];
    const map = new Map();
    items.forEach(item => {
      if(!map.has(item.tipo)){
        const group = {name:item.tipo,items:[]};
        map.set(item.tipo,group);
        groups.push(group);
      }
      map.get(item.tipo).items.push(item);
    });
    groups.forEach(g => g.items.sort((a,b)=>(Number(a.orden)||0)-(Number(b.orden)||0)));

    if(!groups.length){
      root.innerHTML = '<div class="menu-placeholder"><div class="kicker">Menú actual</div><h2 class="serif">Hoy no hay menú publicado</h2><p>Consulta de nuevo más tarde o pregúntanos en el mesón.</p></div>';
    }else{
      root.innerHTML = groups.map(group => '<article class="daily-group"><div class="daily-group-title">'+esc(group.name)+'</div><div class="daily-list">'+group.items.map(item => '<div class="daily-item"><span class="daily-number">'+String((Number(item.orden)||1)).padStart(2,'0')+'</span><div><strong>'+esc(item.plato)+'</strong>'+(item.descripcion?'<p>'+esc(item.descripcion)+'</p>':'')+'</div></div>').join('')+'</div></article>').join('');
    }

    const cfg = data.config || {};
    const full = Number(cfg.precioMenu);
    const half = Number(cfg.precioMedioMenu);
    fullPrice.textContent = Number.isFinite(full) ? formatPrice(full) : '13 €';
    halfPrice.textContent = Number.isFinite(half) ? formatPrice(half) : '10 €';
    status.hidden = true;
  }

  OfaroFastData.loadMenu().then(render).catch(()=>{
    status.hidden = false;
    status.textContent = 'No se pudo cargar el menú del día.';
  });
})();
</script>
</body>
</html>
