// O Faro Gestión v5.0.0-alpha2 · visual foundation adaptada al terminal de trabajo
plugins { id 'com.android.application' }

android {
    namespace 'com.ofaro.participaciones'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.ofaro.participaciones'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '5.0.0-alpha2'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('OFARO_KEYSTORE_PATH')
            if (keystorePath) storeFile file(keystorePath)
            storePassword System.getenv('OFARO_KEYSTORE_PASSWORD')
            keyAlias System.getenv('OFARO_KEY_ALIAS')
            keyPassword System.getenv('OFARO_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
