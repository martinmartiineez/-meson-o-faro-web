name: Patch reservas zona once

on:
  push:
    branches:
      - feature/participaciones-apk

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/participaciones-apk
      - name: Patch ReservationsActivity
        shell: python
        run: |
          from pathlib import Path
          p=Path('android-participaciones/app/src/main/java/com/ofaro/participaciones/ReservationsActivity.java')
          s=p.read_text(encoding='utf-8')
          original=s
          s=s.replace('import android.widget.Button;\nimport android.widget.EditText;', 'import android.widget.ArrayAdapter;\nimport android.widget.Button;\nimport android.widget.EditText;')
          s=s.replace('import android.widget.ScrollView;\nimport android.widget.TextView;', 'import android.widget.ScrollView;\nimport android.widget.Spinner;\nimport android.widget.TextView;')
          old='private void quickLocation(JSONObject r){LinearLayout box=column();box.setPadding(dp(15),dp(3),dp(15),dp(8));EditText table=field(box,"Mesa",r.optString("table",""),InputType.TYPE_CLASS_TEXT);EditText zone=field(box,"Zona",r.optString("zone","Sin asignar"),InputType.TYPE_CLASS_TEXT);new AlertDialog.Builder(this).setTitle("Mesa y zona").setView(box).setNegativeButton("Cancelar",null).setPositiveButton("GUARDAR",(d,w)->updateReservation(r,null,null,val(table),val(zone),null)).show();}'
          new='private void quickLocation(JSONObject r){LinearLayout box=column();box.setPadding(dp(15),dp(3),dp(15),dp(8));EditText table=field(box,"Mesa",r.optString("table",""),InputType.TYPE_CLASS_TEXT);Spinner zone=zoneSpinner(box,r.optString("zone","Interior"));new AlertDialog.Builder(this).setTitle("Mesa y zona").setView(box).setNegativeButton("Cancelar",null).setPositiveButton("GUARDAR",(d,w)->updateReservation(r,null,null,val(table),selected(zone),null)).show();}'
          if old not in s: raise SystemExit('No se encontró quickLocation esperado')
          s=s.replace(old,new,1)
          s=s.replace('EditText zone=field(page,"Zona",r.optString("zone","Sin asignar"),InputType.TYPE_CLASS_TEXT);', 'Spinner zone=zoneSpinner(page,r.optString("zone","Interior"));', 1)
          s=s.replace('EditText zone=field(page,"Zona","Sin asignar",InputType.TYPE_CLASS_TEXT);', 'Spinner zone=zoneSpinner(page,"Interior");', 1)
          s=s.replace('.put("zona",val(zone))', '.put("zona",selected(zone))')
          marker='private GradientDrawable box(int f,int r,int s,int sw)'
          helper='private Spinner zoneSpinner(LinearLayout p,String current){TextView t=text("Zona",13,Color.DKGRAY,true);t.setPadding(0,dp(8),0,dp(4));p.addView(t);Spinner s=new Spinner(this);String[] values={"Interior","Terraza"};ArrayAdapter<String>a=new ArrayAdapter<>(this,android.R.layout.simple_spinner_item,values);a.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);s.setAdapter(a);s.setSelection("Terraza".equalsIgnoreCase(current)?1:0);s.setBackground(box(Color.WHITE,11,Color.rgb(205,205,205),1));p.addView(s,new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,dp(50)));return s;}private String selected(Spinner s){Object x=s.getSelectedItem();return x==null?"Interior":String.valueOf(x);}'
          if marker not in s: raise SystemExit('No se encontró punto de inserción')
          s=s.replace(marker,helper+marker,1)
          if s==original: raise SystemExit('No hubo cambios')
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-participaciones/app/src/main/java/com/ofaro/participaciones/ReservationsActivity.java
          git commit -m "feat(android): selector Interior o Terraza en reservas"
          git push origin HEAD:feature/participaciones-apk
