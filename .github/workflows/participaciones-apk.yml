name: Build O Faro Gestion APK

on:
  push:
    branches: ["feature/participaciones-apk"]
    paths:
      - "android-participaciones/**"
      - ".github/workflows/participaciones-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ofaro-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/participaciones-apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Android SDK 35
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null || true

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" android-participaciones/app/build.gradle | head -n1)
          if [ -z "$VERSION" ]; then
            echo "No se pudo leer versionName" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Compilando O Faro Gestión v$VERSION"

      - name: Lint Android
        working-directory: android-participaciones
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        working-directory: android-participaciones
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p dist
          cp android-participaciones/app/build/outputs/apk/debug/app-debug.apk "dist/O-Faro-Gestion-v${{ steps.app_version.outputs.version }}.apk"
          sha256sum "dist/O-Faro-Gestion-v${{ steps.app_version.outputs.version }}.apk" | tee dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: O-Faro-Gestion-v${{ steps.app_version.outputs.version }}-apk
          path: |
            dist/O-Faro-Gestion-v${{ steps.app_version.outputs.version }}.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
