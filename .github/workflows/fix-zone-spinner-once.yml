name: Fix zone spinner once
on:
  push:
    branches: ["feature/participaciones-apk"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/participaciones-apk
      - name: Fix fallback zone
        shell: python
        run: |
          from pathlib import Path
          p=Path('android-participaciones/app/src/main/java/com/ofaro/participaciones/ReservationsActivity.java')
          s=p.read_text(encoding='utf-8')
          old='.put("zone",val(zone))'
          if old not in s:
              raise SystemExit('No se encontró el fallback antiguo')
          s=s.replace(old,'.put("zone",selected(zone))',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-participaciones/app/src/main/java/com/ofaro/participaciones/ReservationsActivity.java
          git commit -m "fix(android): usar zona seleccionada en reserva nueva"
          git push origin HEAD:feature/participaciones-apk
